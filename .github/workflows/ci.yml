name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Per-ref group: a PR branch's runs must never occupy main's slot. A single static
# group bit the NBA viewer on 2026-08-13. GitHub keeps one running plus one pending
# run per group, and each new arrival CANCELS the previous pending one
# (cancel-in-progress only protects the RUNNING run), so while a busy PR was pushing,
# main's CI and its deploy kept getting canceled before they could start. The only
# lock that must serialize repo-wide is the Pages deploy: the job-level `pages` group
# on the deploy job below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Netlify deploys via its own GitHub integration (it builds the site and the functions
  # on every push using netlify.toml), so there is no Netlify job here — a CI-driven
  # deploy would be a redundant second path to the same site, and it kept deploying
  # while Actions was unavailable, which a job here could not.
  #
  # That build runs `npm run build` only, so it never writes public/coverage.json —
  # which is why that file is committed rather than generated here. The README badge
  # reads it from the Netlify site.

  pages:
    name: Deploy to GitHub Pages
    needs: test # only deploys if tests + build pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize Pages deploys repo-wide, never mid-cancel. Job level, so a queued
    # deploy waits its turn instead of taking a slot in the per-ref group above.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage:badge # writes public/coverage.json for the README badge
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5

  # Check the DEPLOYED site, which nothing else in this repo ever does: the build,
  # the tests and the jobs above all work on local files, so a dead host, a URL
  # pointing at a sibling's site, or a calendar feed that disagrees with the
  # committed schedule are invisible to the entire gate. See
  # sports-viewer-meta/docs/LINEAGES.md section 5.
  #
  # Never a required check: it depends on GitHub Pages and Netlify having finished
  # publishing, and Netlify builds from its own git trigger on its own schedule, so
  # a red run here can mean "not deployed yet" rather than "broken". It reports.
  smoke:
    name: Smoke-test production
    needs: pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Netlify's build is triggered by the same push but runs independently of
      # this workflow, so give it a moment before asking it for the feed.
      - name: Wait for the hosts to publish
        run: sleep 60
      # No `npm ci`: the script uses Node built-ins only.
      - name: Check the deployed URLs and the calendar feed
        shell: bash
        run: node scripts/smoke-prod.mjs
