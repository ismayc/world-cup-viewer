name: Feed freshness

# Early warning that the OpenFootball 2026 feed is committing match scores.
# Runs hourly during the tournament window; the job fails (→ GitHub emails you)
# only when a match that finished >= STALE_HOURS ago still has no score.
# Manually runnable any time via the Actions tab ("Run workflow").

on:
  schedule:
    - cron: '17 * * * *' # hourly, on the :17
  workflow_dispatch:

jobs:
  check:
    name: Check OpenFootball 2026 feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Drift guard: fails (→ email) if upstream cup.txt renames/restructures a
      # team so the autofill can no longer locate a match line. Runs first and
      # always, so a rename is caught even when the feed is also stale.
      - run: npm run check:sync
        if: always()
      # The script exits 0 before the first match finishes and after every
      # finished match has a score, so the job is green outside the tournament.
      - run: npm run check:feed
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises the GitHub API rate limit
      # Schedule-drift guard: fails (→ email) if any UPCOMING match's stored
      # kickoff no longer matches ESPN's scheduled time (a reschedule). The
      # detailed daily report goes out via schedule-check.yml; this is the
      # continuous hourly backstop.
      - run: npm run check:schedule
        if: always()
      # Bracket-consistency guard: once OpenFootball resolves a knockout fixture's
      # real teams (from the official draw/results), fails (→ email) if OUR Annexe C
      # + tie-breaker resolution produces a different matchup. Self-gating: it only
      # compares already-resolved knockout sides, so it lights up as matches finish.
      - run: npm run check:bracket
        if: always()
